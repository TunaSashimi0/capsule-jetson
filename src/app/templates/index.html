<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YOLO Capsule Counter</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <section class="video-area">
        <img id="video-feed" src="/video_feed" alt="Annotated capsule counter video stream">
      </section>

      <aside class="panel">
        <div class="metric primary">
          <span class="label">Total Capsules</span>
          <strong id="capsule-count">0</strong>
        </div>

        <div class="metric-row">
          <div class="metric good-metric">
            <span class="label">Good</span>
            <strong id="good-count">0</strong>
          </div>
          <div class="metric defect-metric">
            <span class="label">Defects</span>
            <strong id="defect-count">0</strong>
          </div>
        </div>

        <div class="metric-row">
          <div class="metric">
            <span class="label">FPS</span>
            <strong id="fps">0.0</strong>
          </div>
          <div class="metric">
            <span class="label">Model</span>
            <strong id="model-state">{{ "Ready" if model_exists else "Missing" }}</strong>
          </div>
        </div>

        <div class="metric-row">
          <div class="metric">
            <span class="label">Avg Width</span>
            <strong><span id="avg-width">0.0</span><small> px</small></strong>
          </div>
          <div class="metric">
            <span class="label">Avg Height</span>
            <strong><span id="avg-height">0.0</span><small> px</small></strong>
          </div>
        </div>

        <div class="metric">
          <span class="label">Avg Rotation</span>
          <strong><span id="avg-angle">0.0</span><small> deg</small></strong>
        </div>

        <section class="measurements">
          <span class="label">Capsule Measurements</span>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Class</th>
                  <th>Conf</th>
                  <th>W</th>
                  <th>H</th>
                  <th>Angle</th>
                </tr>
              </thead>
              <tbody id="measurement-rows">
                <tr>
                  <td colspan="6">No detections</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <form id="settings-form" class="controls">
          <label>
            <span>Model path</span>
            <input name="model" value="{{ settings.model }}">
          </label>

          <label>
            <span>Source</span>
            <input name="source" value="{{ settings.source }}">
          </label>

          <div class="control-grid">
            <label>
              <span>Model input size</span>
              <input name="imgsz" type="number" min="320" step="32" value="{{ settings.imgsz }}">
            </label>

            <label>
              <span>Capture width</span>
              <input name="capture_width" type="number" min="320" step="1" value="{{ settings.capture_width }}">
            </label>

            <label>
              <span>Capture height</span>
              <input name="capture_height" type="number" min="240" step="1" value="{{ settings.capture_height }}">
            </label>

            <label>
              <span>Capture FPS</span>
              <input name="capture_fps" type="number" min="1" max="120" step="1" value="{{ settings.capture_fps }}">
            </label>

            <label>
              <span>Exposure (us, 0=auto)</span>
              <input name="exposure_us" type="number" min="0" step="100" value="{{ settings.exposure_us }}">
            </label>

            <label>
              <span>Analog gain</span>
              <input name="analog_gain" type="number" min="0" max="32" step="0.1" value="{{ settings.analog_gain }}">
            </label>

            <label>
              <span>Digital gain</span>
              <input name="digital_gain" type="number" min="0" max="256" step="0.1" value="{{ settings.digital_gain }}">
            </label>

            <label class="checkbox-control">
              <input name="half" type="checkbox" {% if settings.half %}checked{% endif %}>
              <span>FP16 CUDA</span>
            </label>

            <label>
              <span>Confidence</span>
              <input name="conf" type="number" min="0.01" max="1" step="0.01" value="{{ settings.conf }}">
            </label>

            <label>
              <span>IoU</span>
              <input name="iou" type="number" min="0.01" max="1" step="0.01" value="{{ settings.iou }}">
            </label>

            <label>
              <span>Device</span>
              <input name="device" placeholder="cpu, 0, cuda:0">
            </label>
          </div>

          <div class="actions">
            <button type="submit">Apply</button>
            <button id="stop-button" type="button" class="secondary">Stop</button>
          </div>
        </form>

        <div class="status">
          <span class="label">Status</span>
          <p id="status">Starting stream...</p>
        </div>
      </aside>
    </main>

    <script>
      const countEl = document.querySelector("#capsule-count");
      const goodCountEl = document.querySelector("#good-count");
      const defectCountEl = document.querySelector("#defect-count");
      const fpsEl = document.querySelector("#fps");
      const modelEl = document.querySelector("#model-state");
      const avgWidthEl = document.querySelector("#avg-width");
      const avgHeightEl = document.querySelector("#avg-height");
      const avgAngleEl = document.querySelector("#avg-angle");
      const measurementRowsEl = document.querySelector("#measurement-rows");
      const statusEl = document.querySelector("#status");
      const form = document.querySelector("#settings-form");
      const stopButton = document.querySelector("#stop-button");

      async function refreshStats() {
        const response = await fetch("/stats");
        const data = await response.json();
        countEl.textContent = data.capsule_count ?? 0;
        goodCountEl.textContent = data.good_count ?? 0;
        defectCountEl.textContent = data.defect_count ?? 0;
        fpsEl.textContent = Number(data.fps ?? 0).toFixed(1);
        avgWidthEl.textContent = Number(data.avg_width_px ?? 0).toFixed(1);
        avgHeightEl.textContent = Number(data.avg_height_px ?? 0).toFixed(1);
        avgAngleEl.textContent = Number(data.avg_angle_deg ?? 0).toFixed(1);
        modelEl.textContent = data.model_exists ? (data.precision || "Ready") : "Missing";
        const resolution = data.frame_width && data.frame_height
          ? ` · ${data.frame_width}×${data.frame_height}`
          : "";
        const clipping = data.frame_width
          ? ` · clipped ${Number(data.highlight_clip_pct ?? 0).toFixed(2)}%`
          : "";
        const brightness = data.frame_width
          ? ` · luma ${Number(data.mean_luma ?? 0).toFixed(1)}`
          : "";
        statusEl.textContent = `${data.status ?? "idle"}${resolution}${clipping}${brightness}`;

        const measurements = data.measurements ?? [];
        if (!measurements.length) {
          measurementRowsEl.innerHTML = `<tr><td colspan="6">No detections</td></tr>`;
          return;
        }

        measurementRowsEl.innerHTML = measurements.map((item) => `
          <tr class="${item.class_name === "capsule_defect" ? "defect-row" : ""}">
            <td>${item.index}</td>
            <td class="class-name">${escapeHtml(item.class_name ?? "unknown")}</td>
            <td>${Number(item.confidence ?? 0).toFixed(2)}</td>
            <td>${Number(item.width_px ?? 0).toFixed(1)}</td>
            <td>${Number(item.height_px ?? 0).toFixed(1)}</td>
            <td>${Number(item.angle_deg ?? 0).toFixed(1)}</td>
          </tr>
        `).join("");
      }

      function escapeHtml(value) {
        const element = document.createElement("div");
        element.textContent = String(value);
        return element.innerHTML;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(form).entries());
        payload.half = form.elements.half.checked;
        await fetch("/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        document.querySelector("#video-feed").src = `/video_feed?ts=${Date.now()}`;
        await refreshStats();
      });

      stopButton.addEventListener("click", async () => {
        await fetch("/stop", { method: "POST" });
        await refreshStats();
      });

      refreshStats();
      setInterval(refreshStats, 1000);
    </script>
  </body>
</html>
